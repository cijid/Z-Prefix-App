services:
  backend:
    build: ./crud-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      FRONTEND_HOST: http://localhost:5173

    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx knex migrate:latest && npx knex seed:run && npm start"
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - crud_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./crud-app
    ports:
      - "5173:5173"

volumes:
  crud_postgres_data:
